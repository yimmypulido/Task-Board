<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Wolfboard · Tablero de tareas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="./index.html" aria-label="Wolfboard, inicio"><svg viewBox="0 0 28 28" aria-hidden="true"><path fill="currentColor" d="M1 2h3v3h4v3h3V6h6v2h3V5h4V2h3v14h-3v4h-4v3h-3v3h-6v-3H8v-3H4v-4H1z"/><path fill="#15101f" d="M5 11h4v2h3v3H8v-2H5zm18 0h-4v2h-3v3h4v-2h3zm-12 8h6v3h-6z"/></svg> WOLF<span>BOARD</span></a>
  <div class="theme" role="group" aria-label="Tema de la página"><button data-mode="light" aria-label="Modo claro"><i data-icon="sun"></i><span>Claro</span></button><button data-mode="dark" aria-label="Modo oscuro"><i data-icon="moon"></i><span>Oscuro</span></button></div>
</div></header>
<main>
  <section class="hero" aria-label="Wolfboard">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="hero-copy"><div class="console"><span>▸</span> WORKSPACE / PERSONAL</div><h1 aria-label="Wolfboard"><svg id="wordmark" viewBox="0 0 282 38" aria-hidden="true"></svg></h1><p>Tablero personal de tareas</p></div>
    <div class="signal" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b></div>
  </section>
  <section class="workspace" aria-labelledby="board-title">
    <div class="board-head"><div class="heading"><i data-icon="board"></i><h2 id="board-title">Mi tablero</h2><span id="total"></span></div><button class="primary" id="newTask"><i data-icon="plus"></i>Nueva tarea</button></div>
    <div id="board"></div>
  </section>
  <footer><span><i data-icon="disk"></i><span id="save-state">Guardado local</span></span><span>WOLFBOARD <b>//</b> V1.0</span></footer>
</main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="dialog-title">Nueva tarea</h2><button type="button" id="close" aria-label="Cerrar"><i data-icon="close"></i></button></div>
<label>Título<input id="task-name" required maxlength="140" autocomplete="off"></label>
<label>Descripción (opcional)<textarea id="description" rows="3" maxlength="1500"></textarea></label>
<div class="form-row"><label>Estado<select id="status"><option value="pendiente">Pendiente</option><option value="enProceso">En proceso</option><option value="terminada">Terminada</option></select></label><label>Fecha<input id="date" type="date" required></label></div>
<div class="actions"><button type="button" id="delete">Eliminar</button><button class="primary" type="submit">Guardar tarea</button></div></form></dialog>
<div role="status" class="sr" id="notice"></div>
</body></html>
